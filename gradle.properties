# ---------------------------------------------------------------------------
#  NZVPN — تنظیمات Gradle
#  این مقادیر برای ماشین‌های کم‌حافظه تنظیم شده‌اند؛ روی سیستم خودتان
#  می‌توانید -Xmx را به 2048m یا بیشتر افزایش دهید تا سریع‌تر شود.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx560m -XX:MaxMetaspaceSize=400m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx700m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
